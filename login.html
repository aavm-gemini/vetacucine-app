<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - VetaCucine</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --tema-primario: #3b82f6; 
            
            --tema-oscuro: #1e293b;
            --tema-fondo: #f1f5f9;
        }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: var(--tema-fondo); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; width: 100%; max-width: 400px; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 6px solid var(--tema-oscuro); text-align: center; }
        .logo { font-size: 28px; font-weight: bold; color: var(--tema-oscuro); margin-bottom: 5px; letter-spacing: 1px; }
        .logo span { color: var(--tema-primario); }
        .subtitulo { color: #64748b; font-size: 14px; margin-bottom: 40px; }
        .btn-google { background-color: white; color: #334155; border: 1px solid #cbd5e1; width: 100%; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .btn-google:hover { background-color: #f8fafc; border-color: #94a3b8; }
        .estado-carga { color: #3b82f6; font-size: 14px; font-weight: bold; margin-top: 20px; display: none; }
        .mensaje { margin-top: 20px; font-size: 13px; font-weight: bold; padding: 12px; border-radius: 6px; display: none; }
        .mensaje.error { background-color: #fee2e2; color: #dc2626; display: block; border: 1px solid #fca5a5; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">Veta<span>Cucine</span></div>
        <div class="subtitulo">Acceso Restringido al Personal</div>

        <button class="btn-google" id="btnGoogle" onclick="iniciarConGoogle()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18px" height="18px"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.9c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.13-10.36 7.13-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continuar con Google
        </button>

        <div id="loading" class="estado-carga">Verificando credenciales... ⏳</div>
        <div id="msj-alerta" class="mensaje"></div>
    </div>

    <script>
        const supabaseUrl = 'https://pnrntmkcisgymyvmzson.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBucm50bWtjaXNneW15dm16c29uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNzAwODQsImV4cCI6MjEwNDc0NjA4NH0.fdW9mj9rkO0rxHXB8rBeJc6a32QSQxtvsNtu9_rL6yc'; // <-- ¡Reemplaza esto con tu llave de Supabase!
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session) {
                document.getElementById('btnGoogle').style.display = 'none';
                document.getElementById('loading').style.display = 'block';

                let correoUsuario = session.user.email;
                const { data, error } = await supabaseClient.from('empleados_autorizados').select('*').eq('email', correoUsuario);

                if (data && data.length > 0) {
                    window.location.href = 'dashboard.html';
                } else {
                    await supabaseClient.auth.signOut();
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('btnGoogle').style.display = 'flex';
                    mostrarError(`⚠️ ACCESO DENEGADO ⚠️<br><br>El correo <b>${correoUsuario}</b> no está autorizado.`);
                }
            }
        });

        async function iniciarConGoogle() {
            await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.href
                }
            });
        }

        function mostrarError(texto) {
            let msj = document.getElementById('msj-alerta');
            msj.innerHTML = texto;
            msj.className = "mensaje error";
        }
    </script>
</body>
</html>
